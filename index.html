    <!-- Theme Initialization Script -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('olmera_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = savedTheme === 'dark' || (!savedTheme && systemDark);

          document.documentElement.classList.toggle('dark', isDark);

          var applyBodyTheme = function() {
            if (document.body) document.body.classList.toggle('dark', isDark);
          };

          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyBodyTheme);
          } else {
            applyBodyTheme();
          }
        } catch (e) {}
      })();
    </script>

              <li><strong>Telemedicine:</strong> High-fidelity video consultations for remote outpatient care and follow-ups.</li>
              <li><strong>Medical Records Access:</strong> Centralized digital health vault with AES-256 encrypted diagnostic and lab reports.</li>
              <li><strong>Digital Prescriptions:</strong> Verified digital prescriptions accessible to attending physicians and accredited pharmacies.</li>
              <li><strong>Billing & Insurance:</strong> Transparent billing with itemized invoices and claim documentation.</li>
